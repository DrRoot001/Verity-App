[package]
name = "verity-desktop"
version = "0.4.1"
description = "Verity live interview assistant"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
cpal = "0.15"
reqwest = { version = "0.12", features = ["json", "multipart", "stream"] }
anyhow = "1"
pdf-extract = "0.12"
# Already pulled in transitively (reqwest); declared directly because
# extract_document_text decodes the base64 payload the frontend sends
# instead of a raw byte array, which a multi-MB PDF made ~4x heavier over
# IPC and gave no progress feedback while it serialized.
base64 = "0.22"

# ScreenCaptureKit-based native system-audio capture. Opt-in via the
# `native-system-audio` feature (see [features] below), not a plain
# dependency: the crate bridges a Swift package that requires Swift tools
# 5.9+ (Xcode 15+, which itself requires macOS 13.5+ to install). A build
# machine still on an older Xcode/macOS cannot compile this at all, so it
# must not be part of the default build - enable it explicitly once your
# toolchain supports it: `cargo build --features native-system-audio`.
[target.'cfg(target_os = "macos")'.dependencies]
# Resume OCR uses the OS's own engines (Vision here, Windows.Media.Ocr on
# Windows): offline, free, no model download. Versions match what tauri
# already pulls in, so nothing new is compiled twice.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSData", "NSDictionary", "NSError", "NSString"] }
objc2-core-foundation = { version = "0.3", features = ["CFData", "CFCGTypes"] }
objc2-core-graphics = { version = "0.3", features = ["CGBitmapContext", "CGColorSpace", "CGContext", "CGDataProvider", "CGImage", "CGPDFDocument", "CGPDFPage"] }
objc2-vision = { version = "0.3", features = ["VNRequest", "VNRequestHandler", "VNRecognizeTextRequest", "VNObservation", "objc2-core-graphics"] }
screencapturekit = { version = "8", features = ["macos_13_0"], optional = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Data_Pdf", "Foundation", "Graphics_Imaging", "Media_Ocr", "Storage_Streams"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
native-system-audio = ["dep:screencapturekit"]

# A live interview is the one moment a stutter is unacceptable, so the release
# build is optimised for speed rather than binary size.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
