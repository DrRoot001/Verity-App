[project]
name = "verity"
version = "0.1.0"
description = "Verity — Interview Workspace Platform (backend)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "redis>=5.2",
    "argon2-cffi>=23.1",
    "pyjwt[crypto]>=2.10",
    "cryptography>=43.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "email-validator>=2.2",
    "structlog>=24.4",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-exporter-otlp-proto-http>=1.28",
    "prometheus-client>=0.21",
    "websockets>=13.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-redis",
    "import-linter>=2.1",
    "faker>=33.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["verity*"]

# ── Lint ──────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "TID", "RUF", "ASYNC", "S"]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # FastAPI Depends() in defaults is idiomatic
    "S101",   # assert is fine in tests (scoped below anyway)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"alembic/*" = ["N999", "S608"]
# S105 flags enum *names* containing TOKEN/PASSWORD. These are error codes and
# auth-provider identifiers, not credentials.
"verity/platform/errors.py" = ["S105"]
"verity/modules/identity/models.py" = ["S105"]
# S105 flags enum names and schema fields containing TOKEN/PASSWORD; these are
# scope identifiers and an OAuth token_type literal, not credentials.
"verity/platform/ratelimit.py" = ["S105"]
"verity/modules/identity/schemas.py" = ["S105"]
# RUF001: en dashes, em dashes and the multiplication sign are not typos here —
# real resumes use them in date ranges and metrics, so the parser must match them.
"verity/modules/documents/extraction/resume_parser.py" = ["RUF001"]
# SIM905: the word lists here are maintained as prose blocks on purpose; a
# 40-element list literal is materially harder to scan and edit.
"verity/modules/documents/extraction/text.py" = ["SIM905"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

# ── Types ─────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "argon2.*"]
ignore_missing_imports = true

# ── Tests ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: requires Postgres and Redis",
]

[tool.coverage.run]
source = ["verity"]
omit = ["verity/apps/*/__main__.py"]

# ── Architecture boundaries (PRD §22.2) ───────────────────────────────
[tool.importlinter]
root_package = "verity"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Vendor AI SDKs are confined to ai.providers (NFR-AI-001)"
type = "forbidden"
source_modules = [
    "verity.apps",
    "verity.modules",
    "verity.realtime",
    "verity.platform",
]
forbidden_modules = ["anthropic", "openai"]

[[tool.importlinter.contracts]]
name = "Layered architecture"
type = "layers"
layers = [
    "verity.apps",
    "verity.modules",
    "verity.ai | verity.realtime",
    "verity.platform",
]
exhaustive = false

# Candidate Intelligence is the canonical layer every consumer reads from
# (PRD §9.4, §12). Depending on it is the intended direction; depending on a
# peer feature module is not. So it sits in its own layer rather than being
# declared independent of everything.
#
# Preparation sits above sessions because the Learning Loop flows one way: a
# session produces measured weaknesses, and preparation consumes them. Sessions
# must never read a plan, or the loop becomes a cycle.
[[tool.importlinter.contracts]]
name = "Feature modules sit above Candidate Intelligence"
type = "layers"
layers = [
    "verity.modules.preparation",
    "verity.modules.sessions",
    "verity.modules.workspace",
    "verity.modules.documents",
    "verity.modules.candidate_graph",
]

# Peer feature modules stay independent of each other. Extended as each phase
# lands a module; naming one that does not exist fails the run, so this list is
# always an accurate inventory.
[[tool.importlinter.contracts]]
name = "Peer modules do not import each other's internals"
type = "independence"
modules = [
    "verity.modules.identity",
    "verity.modules.health",
]
